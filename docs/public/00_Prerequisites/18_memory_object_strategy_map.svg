<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="680" viewBox="0 0 1400 680" role="img" aria-labelledby="title desc">
  <title id="title">训练显存对象与策略图</title><desc id="desc">单步显存峰值由常驻状态、动态工作集和异常驻留组成，每类对象对应不同的观察入口。</desc>
  <style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#172033}.title{font-size:30px;font-weight:700}.sub{font-size:16px;fill:#475569}.group{font-size:18px;font-weight:700;fill:#334155}.label{font-size:16px;font-weight:700}.small{font-size:13px;fill:#475569}.panel{stroke-width:2;rx:18;ry:18}.node{stroke-width:2;rx:13;ry:13}.line{stroke:#52606d;stroke-width:3;stroke-linecap:round;fill:none}.branch{stroke:#94a3b8;stroke-width:3;stroke-linecap:round;fill:none}</style>
  <rect width="1400" height="680" fill="#f8fafc"/>
  <text x="58" y="55" class="title">显存峰值：先拆对象，再选择策略</text>
  <text x="58" y="87" class="sub">把显存峰值拆成可识别的对象，才能判断应该减少常驻、压低工作集，还是排查异常引用。</text>
  <rect x="525" y="110" width="350" height="86" class="node" fill="#e0f2fe" stroke="#38bdf8"/>
  <text x="700" y="147" text-anchor="middle" class="label">单步显存峰值</text><text x="700" y="176" text-anchor="middle" class="small">常驻状态 + 动态工作集 + 异常驻留</text>

  <rect x="35" y="250" width="410" height="350" class="panel" fill="#ecfdf5" stroke="#86efac"/>
  <text x="55" y="285" class="group">常驻状态</text>
  <rect x="90" y="320" width="300" height="58" class="node" fill="#ffffff" stroke="#4ade80"/><text x="240" y="355" text-anchor="middle" class="label">对象：参数、梯度、优化器状态</text>
  <rect x="90" y="405" width="300" height="58" class="node" fill="#ffffff" stroke="#4ade80"/><text x="240" y="440" text-anchor="middle" class="label">因素：规模、dtype、分片</text>
  <rect x="90" y="490" width="300" height="58" class="node" fill="#ffffff" stroke="#4ade80"/><text x="240" y="525" text-anchor="middle" class="label">入口：训练状态账本</text>
  <line x1="240" y1="378" x2="240" y2="405" class="line"/><path d="M232 397L240 405L248 397Z" fill="#52606d"/>
  <line x1="240" y1="463" x2="240" y2="490" class="line"/><path d="M232 482L240 490L248 482Z" fill="#52606d"/>

  <rect x="495" y="250" width="410" height="350" class="panel" fill="#fff7ed" stroke="#fdba74"/>
  <text x="515" y="285" class="group">动态工作集</text>
  <rect x="550" y="320" width="300" height="58" class="node" fill="#ffffff" stroke="#f59e0b"/><text x="700" y="355" text-anchor="middle" class="label">对象：Activation、缓冲</text>
  <rect x="550" y="405" width="300" height="58" class="node" fill="#ffffff" stroke="#f59e0b"/><text x="700" y="440" text-anchor="middle" class="label">因素：batch、序列、布局</text>
  <rect x="550" y="490" width="300" height="58" class="node" fill="#ffffff" stroke="#f59e0b"/><text x="700" y="525" text-anchor="middle" class="label">入口：forward / backward 峰值</text>
  <line x1="700" y1="378" x2="700" y2="405" class="line"/><path d="M692 397L700 405L708 397Z" fill="#52606d"/>
  <line x1="700" y1="463" x2="700" y2="490" class="line"/><path d="M692 482L700 490L708 482Z" fill="#52606d"/>

  <rect x="955" y="250" width="410" height="350" class="panel" fill="#fdf2f8" stroke="#f9a8d4"/>
  <text x="975" y="285" class="group">异常驻留</text>
  <rect x="1010" y="320" width="300" height="58" class="node" fill="#ffffff" stroke="#f472b6"/><text x="1160" y="355" text-anchor="middle" class="label">对象：计算图引用、缓存</text>
  <rect x="1010" y="405" width="300" height="58" class="node" fill="#ffffff" stroke="#f472b6"/><text x="1160" y="440" text-anchor="middle" class="label">触发：loss、列表、workspace</text>
  <rect x="1010" y="490" width="300" height="58" class="node" fill="#ffffff" stroke="#f472b6"/><text x="1160" y="525" text-anchor="middle" class="label">入口：时间线持续增长</text>
  <line x1="1160" y1="378" x2="1160" y2="405" class="line"/><path d="M1152 397L1160 405L1168 397Z" fill="#52606d"/>
  <line x1="1160" y1="463" x2="1160" y2="490" class="line"/><path d="M1152 482L1160 490L1168 482Z" fill="#52606d"/>

  <line x1="700" y1="196" x2="700" y2="220" class="branch"/><line x1="240" y1="220" x2="1160" y2="220" class="branch"/>
  <line x1="240" y1="220" x2="240" y2="320" class="line"/><path d="M232 312L240 320L248 312Z" fill="#52606d"/>
  <line x1="700" y1="220" x2="700" y2="320" class="line"/><path d="M692 312L700 320L708 312Z" fill="#52606d"/>
  <line x1="1160" y1="220" x2="1160" y2="320" class="line"/><path d="M1152 312L1160 320L1168 312Z" fill="#52606d"/>
</svg>
