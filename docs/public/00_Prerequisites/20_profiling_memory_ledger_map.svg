<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="760" viewBox="0 0 1480 760" role="img" aria-labelledby="title desc">
  <title id="title">性能分析与显存账本的证据链</title>
  <desc id="desc">一次可复查运行先固定测量条件，再形成时间、显存和可信性三类并行证据。</desc>
  <style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#172033}.title{font-size:30px;font-weight:700}.sub{font-size:16px;fill:#475569}.group{font-size:18px;font-weight:700;fill:#334155}.label{font-size:16px;font-weight:700}.small{font-size:13px;fill:#475569}.panel{stroke-width:2;rx:18;ry:18}.node{stroke-width:2;rx:13;ry:13}.line{stroke:#52606d;stroke-width:3;stroke-linecap:round;fill:none}.branch{stroke:#94a3b8;stroke-width:3;stroke-linecap:round;fill:none}</style>
  <rect width="1480" height="760" fill="#f8fafc"/>
  <text x="58" y="55" class="title">性能分析：从测量条件形成可复查证据</text>
  <text x="58" y="87" class="sub">先固定运行条件，再分别观察时间、显存和结果可信性，避免把不同实验混在一起比较。</text>

  <rect x="535" y="110" width="410" height="86" class="node" fill="#e0f2fe" stroke="#38bdf8"/>
  <text x="740" y="147" text-anchor="middle" class="label">一次可复查运行</text>
  <text x="740" y="176" text-anchor="middle" class="small">同一输入、阶段、资源与重复规则</text>

  <rect x="500" y="250" width="480" height="205" class="panel" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="520" y="285" class="group">测量条件</text>
  <rect x="545" y="320" width="390" height="48" class="node" fill="#ffffff" stroke="#60a5fa"/><text x="740" y="350" text-anchor="middle" class="label">输入与形状</text>
  <rect x="545" y="380" width="390" height="48" class="node" fill="#ffffff" stroke="#60a5fa"/><text x="740" y="410" text-anchor="middle" class="label">阶段、重复次数与预热</text>
  <path d="M740 368V380" class="line"/><path d="M732 372L740 380L748 372Z" fill="#52606d"/>

  <rect x="35" y="535" width="430" height="175" class="panel" fill="#f0fdf4" stroke="#86efac"/>
  <text x="55" y="570" class="group">时间证据</text>
  <rect x="80" y="600" width="340" height="42" class="node" fill="#ffffff" stroke="#4ade80"/><text x="250" y="627" text-anchor="middle" class="label">主机 / 设备 / Kernel 时间</text>
  <rect x="80" y="655" width="340" height="42" class="node" fill="#ffffff" stroke="#4ade80"/><text x="250" y="682" text-anchor="middle" class="small">同步、等待与阶段热点</text>
  <path d="M250 642V655" class="line"/><path d="M242 647L250 655L258 647Z" fill="#52606d"/>

  <rect x="525" y="535" width="430" height="175" class="panel" fill="#fffbeb" stroke="#fbbf24"/>
  <text x="545" y="570" class="group">显存账本</text>
  <rect x="570" y="600" width="340" height="42" class="node" fill="#ffffff" stroke="#f59e0b"/><text x="740" y="627" text-anchor="middle" class="label">已分配 / 已保留 / 峰值显存</text>
  <rect x="570" y="655" width="340" height="42" class="node" fill="#ffffff" stroke="#f59e0b"/><text x="740" y="682" text-anchor="middle" class="small">参数、梯度、状态与激活</text>
  <path d="M740 642V655" class="line"/><path d="M732 647L740 655L748 647Z" fill="#52606d"/>

  <rect x="1015" y="535" width="430" height="175" class="panel" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="1035" y="570" class="group">可信性检查</text>
  <rect x="1060" y="600" width="340" height="42" class="node" fill="#ffffff" stroke="#f87171"/><text x="1230" y="627" text-anchor="middle" class="label">结构契约与数值有限性</text>
  <rect x="1060" y="655" width="340" height="42" class="node" fill="#ffffff" stroke="#f87171"/><text x="1230" y="682" text-anchor="middle" class="small">梯度、异常位置与复现结果</text>
  <path d="M1230 642V655" class="line"/><path d="M1222 647L1230 655L1238 647Z" fill="#52606d"/>

  <path d="M740 196V225M740 225V250" class="line"/><path d="M732 242L740 250L748 242Z" fill="#52606d"/>
  <path d="M740 455V485M250 485H1230" class="branch"/>
  <path d="M250 485V535" class="line"/><path d="M242 527L250 535L258 527Z" fill="#52606d"/>
  <path d="M740 485V535" class="line"/><path d="M732 527L740 535L748 527Z" fill="#52606d"/>
  <path d="M1230 485V535" class="line"/><path d="M1222 527L1230 535L1238 527Z" fill="#52606d"/>
</svg>
