<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430">
  <style>
    text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#1f2937}
    .title{font-size:25px;font-weight:700}.subtitle{font-size:15px;fill:#475569}
    .group{stroke-width:2;rx:18}.node{stroke-width:2;rx:12}
    .group-title{font-size:17px;font-weight:700}.label{font-size:18px;font-weight:700}.small{font-size:14px}
    .line{fill:none;stroke:#64748b;stroke-width:3;marker-end:url(#arrow)}
    .dashed{fill:none;stroke:#94a3b8;stroke-width:2.5;stroke-dasharray:8 6;marker-end:url(#arrow)}
  </style>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="18" y="18" width="1164" height="394" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="600" y="52" text-anchor="middle" class="title">GPU 证据到预算决策</text>
  <text x="600" y="78" text-anchor="middle" class="subtitle">读取已有报告，核验口径，再判断候选策略是否值得保留</text>

  <rect x="48" y="125" width="235" height="190" class="group" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="70" y="155" class="group-title">已有 GPU 证据</text>
  <rect x="70" y="178" width="191" height="52" class="node" fill="#ffffff" stroke="#38bdf8"/>
  <text x="165" y="201" text-anchor="middle" class="label">训练基线报告</text>
  <text x="165" y="220" text-anchor="middle" class="small">模型 / workload / 指标</text>
  <rect x="70" y="245" width="191" height="52" class="node" fill="#ffffff" stroke="#38bdf8"/>
  <text x="165" y="268" text-anchor="middle" class="label">策略对照报告</text>
  <text x="165" y="287" text-anchor="middle" class="small">候选 / 重复运行 / 状态</text>

  <rect x="335" y="125" width="235" height="190" class="group" fill="#eff6ff" stroke="#2563eb"/>
  <text x="357" y="155" class="group-title">证据与预算核验</text>
  <rect x="357" y="188" width="191" height="48" class="node" fill="#ffffff" stroke="#60a5fa"/>
  <text x="452" y="217" text-anchor="middle" class="label">字段与口径</text>
  <rect x="357" y="250" width="191" height="48" class="node" fill="#ffffff" stroke="#60a5fa"/>
  <text x="452" y="279" text-anchor="middle" class="label">预算阈值</text>

  <rect x="622" y="125" width="235" height="190" class="group" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="644" y="155" class="group-title">候选与敏感性</text>
  <rect x="644" y="188" width="191" height="48" class="node" fill="#ffffff" stroke="#4ade80"/>
  <text x="739" y="217" text-anchor="middle" class="label">可行候选集合</text>
  <rect x="644" y="250" width="191" height="48" class="node" fill="#ffffff" stroke="#4ade80"/>
  <text x="739" y="279" text-anchor="middle" class="label">阈值敏感性</text>

  <rect x="909" y="155" width="225" height="112" class="node" fill="#fff7ed" stroke="#f97316"/>
  <text x="1021" y="190" text-anchor="middle" class="label">预算决策 JSON</text>
  <text x="1021" y="216" text-anchor="middle" class="small">accept / tune / reject</text>
  <text x="1021" y="239" text-anchor="middle" class="small">交给后续复核</text>

  <path d="M283 220 H335" class="line"/>
  <path d="M570 220 H622" class="line"/>
  <path d="M857 220 H909" class="line"/>
  <path d="M1021 267 V340 H739 V315" class="dashed"/>
  <text x="600" y="374" text-anchor="middle" class="subtitle">实线：决策数据流　虚线：结果进入后续 profiling 或预算复核</text>
</svg>
