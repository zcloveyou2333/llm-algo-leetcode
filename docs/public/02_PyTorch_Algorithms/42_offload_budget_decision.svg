<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">激活卸载的显存预算决策</title><desc id="desc">根据激活大小、复用距离和 GPU 预算筛选搬运对象，再比较显存收益与搬运代价，输出策略判断。</desc>
<defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;fill:#17324d}.title{font-size:26px;font-weight:700}.sub{font-size:15px;fill:#526b80}.label{font-size:18px;font-weight:700}.small{font-size:13px;fill:#526b80}.node{fill:#fff;stroke-width:2;rx:16}.flow{stroke:#2f6f9f;stroke-width:2.5;fill:none}.arrow{fill:#2f6f9f}.gate{fill:#fff8ed;stroke:#e0b878}.input{fill:#f3f8fb;stroke:#9ec5d8}.plan{fill:#f5f8f2;stroke:#afc899}.output{fill:#f5f3ff;stroke:#c4b5fd}</style></defs>
<rect width="1200" height="560" rx="20" fill="#f7fafc"/><text x="600" y="40" text-anchor="middle" class="title">激活卸载：从对象筛选到策略判断</text><text x="600" y="66" text-anchor="middle" class="sub">先判断释放空间，再核对搬运代价，最后决定是否采用 Offload</text>
<path d="M600 156V200" class="flow"/><polygon points="600,206 594,194 606,194" class="arrow"/>
<rect x="425" y="88" width="350" height="68" class="node" fill="#e7f2f8" stroke="#2f6f9f"/><text x="600" y="118" text-anchor="middle" class="label">激活块与 GPU 预算</text><text x="600" y="142" text-anchor="middle" class="small">大小、复用距离、可搬运性</text>
<rect x="80" y="200" width="280" height="250" class="node input"/><text x="220" y="238" text-anchor="middle" class="label">对象筛选</text><rect x="115" y="270" width="210" height="58" class="node"/><text x="220" y="305" text-anchor="middle" class="label">保留热块</text><path d="M220 328V350" class="flow"/><polygon points="220,356 214,344 226,344" class="arrow"/><rect x="115" y="356" width="210" height="58" class="node"/><text x="220" y="391" text-anchor="middle" class="label">搬出冷块</text>
<rect x="460" y="200" width="280" height="250" class="node plan"/><text x="600" y="238" text-anchor="middle" class="label">容量检查</text><rect x="495" y="270" width="210" height="58" class="node"/><text x="600" y="305" text-anchor="middle" class="label">保留量进入预算？</text><path d="M600 328V350" class="flow"/><polygon points="600,356 594,344 606,344" class="arrow"/><rect x="495" y="356" width="210" height="58" class="node"/><text x="600" y="391" text-anchor="middle" class="label">形成搬运计划</text>
<rect x="840" y="200" width="280" height="250" class="node gate"/><text x="980" y="238" text-anchor="middle" class="label">代价判断</text><rect x="875" y="270" width="210" height="58" class="node"/><text x="980" y="305" text-anchor="middle" class="label">搬运时间可接受？</text><path d="M980 328V350" class="flow"/><polygon points="980,356 974,344 986,344" class="arrow"/><rect x="875" y="356" width="210" height="58" class="node output"/><text x="980" y="391" text-anchor="middle" class="label">accept · tune · reject</text>
<path d="M360 300H460M740 300H840" class="flow"/><polygon points="466,300 454,294 454,306" class="arrow"/><polygon points="846,300 834,294 834,306" class="arrow"/>
</svg>
