<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
<title id="title">训练显存优化的三种状态处理方式</title><desc id="desc">前向产生的激活在反向时仍可能需要，训练可以保存、重算或搬运这些状态，分别把压力转移到显存、计算或带宽。</desc>
<defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;fill:#172033}.title{font-size:29px;font-weight:700}.sub{font-size:15px;fill:#475569}.label{font-size:18px;font-weight:700}.small{font-size:13px;fill:#475569}.node{stroke-width:2.5;rx:18}.flow{stroke:#64748b;stroke-width:2.5;fill:none}.arrow{fill:#64748b}</style></defs>
<rect width="1400" height="560" fill="#f8fafc"/><text x="700" y="42" text-anchor="middle" class="title">同一份 activation，三种处理路径</text><text x="700" y="70" text-anchor="middle" class="sub">激活在反向时仍要使用，策略的区别在于把代价转移到哪里</text>
<rect x="535" y="105" width="330" height="78" class="node" fill="#e0f2fe" stroke="#38bdf8"/><text x="700" y="139" text-anchor="middle" class="label">前向产生 activation</text><text x="700" y="163" text-anchor="middle" class="small">反向阶段需要其中一部分</text>
<path d="M700 183V215M700 215H220M700 215H700M700 215H1180M220 215V260M700 215V260M1180 215V260" class="flow"/><polygon points="220,266 214,254 226,254" class="arrow"/><polygon points="700,266 694,254 706,254" class="arrow"/><polygon points="1180,266 1174,254 1186,254" class="arrow"/>
<rect x="70" y="260" width="300" height="210" class="node" fill="#eff6ff" stroke="#60a5fa"/><text x="220" y="302" text-anchor="middle" class="label">保存</text><text x="220" y="342" text-anchor="middle" class="small">保留在 GPU</text><path d="M220 360V395" class="flow"/><polygon points="220,401 214,389 226,389" class="arrow"/><text x="220" y="430" text-anchor="middle" class="small">显存换计算</text>
<rect x="550" y="260" width="300" height="210" class="node" fill="#f5f3ff" stroke="#a78bfa"/><text x="700" y="302" text-anchor="middle" class="label">重算</text><text x="700" y="342" text-anchor="middle" class="small">只保留区段边界</text><path d="M700 360V395" class="flow"/><polygon points="700,401 694,389 706,389" class="arrow"/><text x="700" y="430" text-anchor="middle" class="small">计算换显存</text>
<rect x="1030" y="260" width="300" height="210" class="node" fill="#ecfccb" stroke="#84cc16"/><text x="1180" y="302" text-anchor="middle" class="label">搬运</text><text x="1180" y="342" text-anchor="middle" class="small">移到 CPU / Host</text><path d="M1180 360V395" class="flow"/><polygon points="1180,401 1174,389 1186,389" class="arrow"/><text x="1180" y="430" text-anchor="middle" class="small">带宽与同步换显存</text>
</svg>
