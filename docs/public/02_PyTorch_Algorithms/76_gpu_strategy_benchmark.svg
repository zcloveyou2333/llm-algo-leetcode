<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="500" viewBox="0 0 1280 500">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#64748b"/>
    </marker>
    <style>
      text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#1f2937}
      .title{font-size:27px;font-weight:700}.subtitle{font-size:15px;fill:#475569}
      .group-title{font-size:17px;font-weight:700}.label{font-size:17px;font-weight:700}
      .small{font-size:14px;fill:#475569}.group{stroke-width:2;rx:18}.node{stroke-width:2;rx:12}
      .line{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}
      .dashed{fill:none;stroke:#94a3b8;stroke-width:2.5;stroke-dasharray:8 6;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect x="18" y="18" width="1244" height="464" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="640" y="54" text-anchor="middle" class="title">激活显存策略对照实验</text>
  <text x="640" y="80" text-anchor="middle" class="subtitle">固定同一训练条件，比较显存下降与额外时间成本</text>

  <rect x="390" y="105" width="500" height="78" class="node" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="640" y="137" text-anchor="middle" class="label">统一实验条件</text>
  <text x="640" y="162" text-anchor="middle" class="small">同一模型、输入、batch、seq_len、dtype、优化器与重复次数</text>

  <rect x="55" y="220" width="805" height="153" class="group" fill="#eff6ff" stroke="#2563eb"/>
  <text x="78" y="249" class="group-title">对照变量：只改变激活值的保存、重算或搬运方式</text>

  <rect x="78" y="274" width="178" height="72" class="node" fill="#ffffff" stroke="#60a5fa"/>
  <text x="167" y="303" text-anchor="middle" class="label">直接保存</text>
  <text x="167" y="326" text-anchor="middle" class="small">显存与速度参照</text>
  <rect x="278" y="274" width="178" height="72" class="node" fill="#ffffff" stroke="#60a5fa"/>
  <text x="367" y="303" text-anchor="middle" class="label">激活重算</text>
  <text x="367" y="326" text-anchor="middle" class="small">用计算换显存</text>
  <rect x="478" y="274" width="178" height="72" class="node" fill="#ffffff" stroke="#60a5fa"/>
  <text x="567" y="303" text-anchor="middle" class="label">CPU 搬运</text>
  <text x="567" y="326" text-anchor="middle" class="small">用传输换显存</text>
  <rect x="678" y="274" width="158" height="72" class="node" fill="#ffffff" stroke="#60a5fa"/>
  <text x="757" y="303" text-anchor="middle" class="label">混合策略</text>
  <text x="757" y="326" text-anchor="middle" class="small">重算与搬运</text>

  <rect x="945" y="205" width="250" height="102" class="node" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="1070" y="238" text-anchor="middle" class="label">统一指标</text>
  <text x="1070" y="264" text-anchor="middle" class="small">峰值显存、step time、吞吐</text>
  <text x="1070" y="286" text-anchor="middle" class="small">eval loss、OOM、重复稳定性</text>

  <rect x="945" y="345" width="250" height="84" class="node" fill="#fff7ed" stroke="#f97316"/>
  <text x="1070" y="378" text-anchor="middle" class="label">证据与决策</text>
  <text x="1070" y="404" text-anchor="middle" class="small">JSON 记录 → 复测 → accept / tune / reject</text>

  <path d="M640 183 V202 H455 V220" class="line"/>
  <path d="M860 297 H945" class="line"/>
  <path d="M1195 256 V345" class="dashed"/>
  <text x="895" y="292" text-anchor="middle" class="small">同一测量口径</text>
  <text x="1210" y="323" class="small">证据交给决策</text>
</svg>
