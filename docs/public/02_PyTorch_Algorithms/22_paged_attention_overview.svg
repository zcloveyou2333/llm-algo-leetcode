<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
<title id="title">PagedAttention：逻辑块如何映射到物理 KV Cache</title><desc id="desc">请求的逻辑 token 经过固定大小的逻辑分块和 Block Table 映射到可以非连续分配的物理 KV Block。</desc>
<defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;fill:#172033}.title{font-size:29px;font-weight:700}.sub{font-size:15px;fill:#475569}.label{font-size:18px;font-weight:700}.small{font-size:13px;fill:#475569}.box{stroke-width:2.5;rx:16}.flow{stroke:#64748b;stroke-width:2.5;fill:none}.arrow{fill:#64748b}.map{stroke:#7c3aed;stroke-width:2.5;stroke-dasharray:7 6;fill:none}.mapArrow{fill:#7c3aed}</style></defs>
<rect width="1400" height="620" fill="#f8fafc"/><text x="700" y="42" text-anchor="middle" class="title">PagedAttention：逻辑地址与物理存储分离</text><text x="700" y="70" text-anchor="middle" class="sub">请求看到连续 token；Block Table 把逻辑 Block 映射到非连续的物理 KV Block</text>
<rect x="505" y="100" width="390" height="82" class="box" fill="#e0f2fe" stroke="#7dd3fc"/><text x="700" y="135" text-anchor="middle" class="label">请求 token 序列</text><text x="700" y="161" text-anchor="middle" class="small">逻辑长度随 Prefill 与 Decode 增长</text>
<path d="M700 182V220" class="flow"/><polygon points="700,226 694,214 706,214" class="arrow"/>
<rect x="75" y="250" width="350" height="250" class="box" fill="#fff7ed" stroke="#fdba74"/><text x="250" y="284" text-anchor="middle" class="label">逻辑视图</text><rect x="120" y="320" width="260" height="68" class="box" fill="#fff" stroke="#f59e0b"/><text x="250" y="348" text-anchor="middle" class="label">逻辑 Block</text><text x="250" y="370" text-anchor="middle" class="small">按固定 token 数分块</text><path d="M250 388V410" class="flow"/><polygon points="250,416 244,404 256,404" class="arrow"/><rect x="120" y="416" width="260" height="58" class="box" fill="#fff" stroke="#f59e0b"/><text x="250" y="451" text-anchor="middle" class="small">顺序保持连续</text>
<rect x="525" y="250" width="350" height="250" class="box" fill="#f5f3ff" stroke="#c4b5fd"/><text x="700" y="284" text-anchor="middle" class="label">地址映射</text><rect x="570" y="320" width="260" height="68" class="box" fill="#fff" stroke="#8b5cf6"/><text x="700" y="348" text-anchor="middle" class="label">Block Table</text><text x="700" y="370" text-anchor="middle" class="small">逻辑 Block → 物理 Block</text><path d="M700 388V410" class="flow"/><polygon points="700,416 694,404 706,404" class="arrow"/><rect x="570" y="416" width="260" height="58" class="box" fill="#fff" stroke="#8b5cf6"/><text x="700" y="451" text-anchor="middle" class="small">为请求保存映射</text>
<rect x="975" y="250" width="350" height="250" class="box" fill="#ecfccb" stroke="#bef264"/><text x="1150" y="284" text-anchor="middle" class="label">物理存储</text><rect x="1020" y="320" width="260" height="68" class="box" fill="#fff" stroke="#65a30d"/><text x="1150" y="348" text-anchor="middle" class="label">物理 KV Block</text><text x="1150" y="370" text-anchor="middle" class="small">显存池中的固定大小块</text><path d="M1150 388V410" class="flow"/><polygon points="1150,416 1144,404 1156,404" class="arrow"/><rect x="1020" y="416" width="260" height="58" class="box" fill="#fff" stroke="#65a30d"/><text x="1150" y="451" text-anchor="middle" class="small">非连续、按需分配与回收</text>
<path d="M425 354H525M875 354H975" class="map"/><polygon points="531,354 519,348 519,360" class="mapArrow"/><polygon points="981,354 969,348 969,360" class="mapArrow"/>
<polygon points="700,226 694,214 706,214" class="arrow"/><polygon points="250,416 244,404 256,404" class="arrow"/><polygon points="700,416 694,404 706,404" class="arrow"/><polygon points="1150,416 1144,404 1156,404" class="arrow"/>
</svg>
