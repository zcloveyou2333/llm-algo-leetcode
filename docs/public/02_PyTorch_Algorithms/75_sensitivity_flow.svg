<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
  <title id="title">预算阈值敏感性分析</title>
  <desc id="desc">在同一份测量结果上只改变预算阈值，重新计算候选方案，并记录结论是否稳定。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1L11 6L1 11Z" fill="#475569"/>
    </marker>
    <style>
      text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#1f2937}
      .title{font-size:25px;font-weight:700}.subtitle{font-size:15px;font-weight:500;fill:#475569}
      .label{font-size:16px;font-weight:700}.small{font-size:13px;fill:#334155}
      .panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2;rx:18}.node{stroke-width:2;rx:12}
      .flow{fill:none;stroke:#475569;stroke-width:2.5;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1000" height="430" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="500" y="42" text-anchor="middle" class="title">预算阈值敏感性分析</text>
  <text x="500" y="70" text-anchor="middle" class="subtitle">测量结果不变，只改变一个阈值，观察预算结论是否稳定</text>
  <rect x="30" y="105" width="940" height="255" class="panel"/>

  <rect x="50" y="175" width="160" height="110" class="node" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="130" y="211" text-anchor="middle" class="label">保留测量结果</text>
  <text x="130" y="240" text-anchor="middle" class="small">同一报告与 workload</text>

  <rect x="230" y="175" width="160" height="110" class="node" fill="#fef3c7" stroke="#d97706"/>
  <text x="310" y="211" text-anchor="middle" class="label">只改一个阈值</text>
  <text x="310" y="240" text-anchor="middle" class="small">显存、吞吐或质量</text>

  <rect x="410" y="175" width="160" height="110" class="node" fill="#fef9c3" stroke="#ca8a04"/>
  <text x="490" y="211" text-anchor="middle" class="label">重新计算</text>
  <text x="490" y="240" text-anchor="middle" class="small">可行方案集合</text>

  <rect x="590" y="175" width="160" height="110" class="node" fill="#dcfce7" stroke="#16a34a"/>
  <text x="670" y="211" text-anchor="middle" class="label">比较候选</text>
  <text x="670" y="240" text-anchor="middle" class="small">集合与最佳方案</text>

  <rect x="770" y="175" width="180" height="110" class="node" fill="#f3e8ff" stroke="#9333ea"/>
  <text x="860" y="211" text-anchor="middle" class="label">记录稳定性</text>
  <text x="860" y="240" text-anchor="middle" class="small">稳定或阈值敏感</text>

  <path d="M210 230 H222" class="flow"/>
  <path d="M390 230 H402" class="flow"/>
  <path d="M570 230 H582" class="flow"/>
  <path d="M750 230 H762" class="flow"/>
</svg>
