<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="540" viewBox="0 0 1680 540">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <style>
      .title{font:700 28px sans-serif;fill:#0f172a}
      .group{font:700 18px sans-serif;fill:#334155}
      .label{font:700 17px sans-serif;fill:#0f172a}
      .text{font:14px sans-serif;fill:#334155}
      .box{stroke:#94a3b8;stroke-width:2;rx:14}
      .metric{stroke:#cbd5e1;stroke-width:1.5;rx:9}
      .flow{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1680" height="540" fill="#f8fafc"/>
  <text x="840" y="42" text-anchor="middle" class="title">推测解码：从生成机制到收益判断</text>

  <rect x="30" y="105" width="330" height="300" class="box" fill="#e0f2fe"/>
  <text x="195" y="143" text-anchor="middle" class="group">实验口径</text>
  <rect x="60" y="180" width="270" height="78" class="metric" fill="#ffffff"/>
  <text x="195" y="212" text-anchor="middle" class="label">target / draft</text>
  <text x="195" y="237" text-anchor="middle" class="text">模型、版本、dtype</text>
  <rect x="60" y="285" width="270" height="78" class="metric" fill="#ffffff"/>
  <text x="195" y="317" text-anchor="middle" class="label">workload 与质量</text>
  <text x="195" y="342" text-anchor="middle" class="text">prompt、采样、误差门槛</text>

  <rect x="420" y="105" width="430" height="300" class="box" fill="#eef8f1"/>
  <text x="635" y="143" text-anchor="middle" class="group">单轮生成机制</text>
  <rect x="450" y="180" width="170" height="78" class="metric" fill="#ffffff"/>
  <text x="535" y="212" text-anchor="middle" class="label">proposal</text>
  <text x="535" y="237" text-anchor="middle" class="text">draft 生成候选</text>
  <rect x="670" y="180" width="150" height="78" class="metric" fill="#ffffff"/>
  <text x="745" y="212" text-anchor="middle" class="label">verify</text>
  <text x="745" y="237" text-anchor="middle" class="text">target 批量验证</text>
  <rect x="450" y="285" width="170" height="78" class="metric" fill="#ffffff"/>
  <text x="535" y="317" text-anchor="middle" class="label">accept</text>
  <text x="535" y="342" text-anchor="middle" class="text">接受连续 token</text>
  <rect x="670" y="285" width="150" height="78" class="metric" fill="#ffffff"/>
  <text x="745" y="317" text-anchor="middle" class="label">reject / correct</text>
  <text x="745" y="342" text-anchor="middle" class="text">分歧后回退修正</text>
  <path d="M620 219 H665" class="flow"/>
  <path d="M745 258 V280" class="flow"/>
  <path d="M670 324 H625" class="flow"/>

  <rect x="910" y="105" width="350" height="300" class="box" fill="#fff4e5"/>
  <text x="1085" y="143" text-anchor="middle" class="group">收益与成本证据</text>
  <rect x="940" y="180" width="130" height="78" class="metric" fill="#ffffff"/>
  <text x="1005" y="212" text-anchor="middle" class="label">推进量</text>
  <text x="1005" y="237" text-anchor="middle" class="text">accepted / round</text>
  <rect x="1090" y="180" width="140" height="78" class="metric" fill="#ffffff"/>
  <text x="1160" y="212" text-anchor="middle" class="label">调用成本</text>
  <text x="1160" y="237" text-anchor="middle" class="text">target / verify</text>
  <rect x="940" y="285" width="130" height="78" class="metric" fill="#ffffff"/>
  <text x="1005" y="317" text-anchor="middle" class="label">性能</text>
  <text x="1005" y="342" text-anchor="middle" class="text">TPOT / throughput</text>
  <rect x="1090" y="285" width="140" height="78" class="metric" fill="#ffffff"/>
  <text x="1160" y="317" text-anchor="middle" class="label">质量</text>
  <text x="1160" y="342" text-anchor="middle" class="text">输出一致性</text>
  <path d="M850 219 H880 V219 H905" class="flow"/>
  <path d="M850 324 H880 V324 H905" class="flow"/>

  <rect x="1320" y="105" width="330" height="300" class="box" fill="#f0e8ff"/>
  <text x="1485" y="143" text-anchor="middle" class="group">对照与判断</text>
  <rect x="1350" y="180" width="270" height="78" class="metric" fill="#ffffff"/>
  <text x="1485" y="212" text-anchor="middle" class="label">G0 / G1 / G2</text>
  <text x="1485" y="237" text-anchor="middle" class="text">baseline、speculative、单变量</text>
  <rect x="1350" y="285" width="270" height="78" class="metric" fill="#ffffff"/>
  <text x="1485" y="317" text-anchor="middle" class="label">accept / tune / reject</text>
  <text x="1485" y="342" text-anchor="middle" class="text">收益、成本和质量共同决定</text>
  <path d="M1260 219 H1315" class="flow"/>
  <path d="M1260 324 H1315" class="flow"/>
</svg>
