<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="t d">
<title id="t">梯度累积训练路径总览</title>
<desc id="d">一次逻辑更新由多个 micro-batch 组成，梯度在多次反向传播中累积；单次 activation 峰值下降，但参数、梯度和优化器状态仍然驻留，最终需要保持更新口径一致。</desc>
<defs>
  <style>
    text{font-family:"Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;fill:#172033}
    .title{font-size:29px;font-weight:700}.sub{font-size:15px;fill:#475569}
    .group{font-size:18px;font-weight:700}.head{font-size:17px;font-weight:700}
    .body{font-size:14px}.small{font-size:12px;fill:#475569}
    .panel{stroke-width:2;rx:16}.node{fill:#fff;stroke:#cbd5e1;stroke-width:1.5;rx:11}
    .flow{stroke:#64748b;stroke-width:2.5;fill:none}.arrow{fill:#64748b}
  </style>
</defs>
<rect width="1200" height="620" fill="#f8fafc"/>
<text x="600" y="42" text-anchor="middle" class="title">梯度累积：一次逻辑更新如何展开</text>
<text x="600" y="70" text-anchor="middle" class="sub">同一逻辑 batch 被拆成多次计算，同时观察显存峰值与参数更新口径</text>

<rect x="405" y="100" width="390" height="82" fill="#e0f2fe" stroke="#7dd3fc" class="panel"/>
<text x="600" y="135" text-anchor="middle" class="group">一次逻辑更新</text>
<text x="600" y="161" text-anchor="middle" class="body">有效 batch = micro-batch × 累积次数</text>

<path d="M600 182V218H205M600 218H600M600 218H995" class="flow"/>
<path d="M205 218V270M600 218V270M995 218V270" class="flow"/>
<polygon points="205,276 199,264 211,264" class="arrow"/>
<polygon points="600,276 594,264 606,264" class="arrow"/>
<polygon points="995,276 989,264 1001,264" class="arrow"/>

<rect x="45" y="270" width="320" height="250" fill="#eff6ff" stroke="#60a5fa" class="panel"/>
<text x="205" y="304" text-anchor="middle" class="group">计算拆分</text>
<rect x="85" y="335" width="240" height="68" class="node"/>
<text x="205" y="363" text-anchor="middle" class="head">逻辑 batch</text>
<text x="205" y="385" text-anchor="middle" class="small">一次更新看到的样本总量</text>
<path d="M205 403V425" class="flow"/><polygon points="205,431 199,419 211,419" class="arrow"/>
<rect x="85" y="431" width="240" height="68" class="node"/>
<text x="205" y="459" text-anchor="middle" class="head">micro-batch</text>
<text x="205" y="481" text-anchor="middle" class="small">每次只处理一部分样本</text>

<rect x="440" y="270" width="320" height="250" fill="#fef3c7" stroke="#f59e0b" class="panel"/>
<text x="600" y="304" text-anchor="middle" class="group">显存变化</text>
<rect x="480" y="335" width="240" height="68" class="node"/>
<text x="600" y="363" text-anchor="middle" class="head">单次 activation 峰值</text>
<text x="600" y="385" text-anchor="middle" class="small">随 micro-batch 规模变化</text>
<path d="M600 403V425" class="flow"/><polygon points="600,431 594,419 606,419" class="arrow"/>
<rect x="480" y="431" width="240" height="68" class="node"/>
<text x="600" y="459" text-anchor="middle" class="head">长期驻留状态</text>
<text x="600" y="481" text-anchor="middle" class="small">参数、梯度、optimizer state</text>

<rect x="835" y="270" width="320" height="250" fill="#dcfce7" stroke="#4ade80" class="panel"/>
<text x="995" y="304" text-anchor="middle" class="group">更新一致性</text>
<rect x="875" y="335" width="240" height="68" class="node"/>
<text x="995" y="363" text-anchor="middle" class="head">每个 loss 除以 K</text>
<text x="995" y="385" text-anchor="middle" class="small">保持平均梯度尺度</text>
<path d="M995 403V425" class="flow"/><polygon points="995,431 989,419 1001,419" class="arrow"/>
<rect x="875" y="431" width="240" height="68" class="node"/>
<text x="995" y="459" text-anchor="middle" class="head">累积完成后更新一次</text>
<text x="995" y="481" text-anchor="middle" class="small">一次逻辑 batch 一次参数更新</text>

</svg>
