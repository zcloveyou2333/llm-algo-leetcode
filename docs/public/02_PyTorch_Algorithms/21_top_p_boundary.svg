<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
<title id="title">Top-p 边界保留</title><desc id="desc">按概率从高到低累加，保留累计概率首次达到阈值的边界 token，再屏蔽后续 token 并重新归一化。</desc>
<defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.sub{font-size:15px;fill:#475569}.label{font-size:17px;font-weight:700}.small{font-size:13px;fill:#475569}.token{font-size:16px;font-weight:700}.line{stroke:#64748b;stroke-width:2.5;fill:none}.arrow{fill:#64748b}</style></defs>
<rect width="1200" height="500" fill="#f8fafc"/><text x="600" y="42" text-anchor="middle" class="title">Top-p：累计概率决定候选边界</text><text x="600" y="70" text-anchor="middle" class="sub">示例 p = 0.85：首次跨过阈值的 token 必须保留</text>
<text x="70" y="130" class="label">按概率从高到低排列</text>
<g transform="translate(70,155)"><rect x="0" y="0" width="180" height="90" rx="14" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/><text x="90" y="37" text-anchor="middle" class="token">t1：0.50</text><text x="90" y="66" text-anchor="middle" class="small">累计 0.50</text><rect x="200" y="0" width="180" height="90" rx="14" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/><text x="290" y="37" text-anchor="middle" class="token">t2：0.30</text><text x="290" y="66" text-anchor="middle" class="small">累计 0.80</text><rect x="400" y="0" width="180" height="90" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="490" y="37" text-anchor="middle" class="token">t3：0.10</text><text x="490" y="66" text-anchor="middle" class="small">累计 0.90</text><rect x="600" y="0" width="180" height="90" rx="14" fill="#e5e7eb" stroke="#9ca3af" stroke-width="2"/><text x="690" y="37" text-anchor="middle" class="token">t4：0.05</text><text x="690" y="66" text-anchor="middle" class="small">屏蔽</text><rect x="800" y="0" width="180" height="90" rx="14" fill="#e5e7eb" stroke="#9ca3af" stroke-width="2"/><text x="890" y="37" text-anchor="middle" class="token">t5：0.05</text><text x="890" y="66" text-anchor="middle" class="small">屏蔽</text></g>
<path d="M560 245V285" stroke="#d97706" stroke-width="3" stroke-dasharray="8 6"/><text x="560" y="310" text-anchor="middle" class="label">p = 0.85 的边界</text>
<path d="M560 325V365" class="line"/><polygon points="560,371 554,359 566,359" class="arrow"/>
<text x="600" y="400" text-anchor="middle" class="label">保留 t1、t2、t3 → 屏蔽后续 token → Softmax 重整化</text>
</svg>
