<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
<title id="title">PagedAttention 块表与请求生命周期</title><desc id="desc">Prefill 建立初始块表，Decode 在块边界扩容，请求完成后释放物理块并供后续请求复用。</desc>
<defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;fill:#172033}.title{font-size:29px;font-weight:700}.sub{font-size:15px;fill:#475569}.label{font-size:18px;font-weight:700}.small{font-size:13px;fill:#475569}.stage{stroke-width:2.5;rx:20}.node{fill:#fff;stroke:#cbd5e1;stroke-width:1.5;rx:12}.flow{stroke:#64748b;stroke-width:2.5;fill:none}.arrow{fill:#64748b}.pool{stroke:#7c3aed;stroke-width:2;stroke-dasharray:7 6;fill:none}</style></defs>
<rect width="1400" height="560" fill="#f8fafc"/><text x="700" y="42" text-anchor="middle" class="title">PagedAttention：请求如何使用和归还物理块</text><text x="700" y="70" text-anchor="middle" class="sub">Block Table 随请求状态变化，物理块在分配、扩容和释放之间循环</text>
<path d="M230 290H1170" class="flow"/><polygon points="1176,290 1164,284 1164,296" class="arrow"/>
<circle cx="230" cy="290" r="12" fill="#f59e0b"/><circle cx="700" cy="290" r="12" fill="#16a34a"/><circle cx="1170" cy="290" r="12" fill="#8b5cf6"/>
<rect x="70" y="145" width="320" height="220" class="stage" fill="#fff7ed" stroke="#fdba74"/><text x="230" y="190" text-anchor="middle" class="label">Prefill</text><rect x="110" y="225" width="240" height="68" class="node"/><text x="230" y="253" text-anchor="middle" class="label">初始分配</text><text x="230" y="275" text-anchor="middle" class="small">按 prompt 长度申请物理块</text><text x="230" y="330" text-anchor="middle" class="small">建立 Block Table</text>
<rect x="540" y="145" width="320" height="220" class="stage" fill="#ecfccb" stroke="#86efac"/><text x="700" y="190" text-anchor="middle" class="label">Decode</text><rect x="580" y="225" width="240" height="68" class="node"/><text x="700" y="253" text-anchor="middle" class="label">跨边界扩容</text><text x="700" y="275" text-anchor="middle" class="small">当前块装满时追加新块</text><text x="700" y="330" text-anchor="middle" class="small">更新逻辑到物理映射</text>
<rect x="1010" y="145" width="320" height="220" class="stage" fill="#f5f3ff" stroke="#c4b5fd"/><text x="1170" y="190" text-anchor="middle" class="label">完成与复用</text><rect x="1050" y="225" width="240" height="68" class="node"/><text x="1170" y="253" text-anchor="middle" class="label">释放物理块</text><text x="1170" y="275" text-anchor="middle" class="small">清空映射并归还池</text><text x="1170" y="330" text-anchor="middle" class="small">供后续请求复用</text>
<rect x="250" y="425" width="900" height="70" class="stage" fill="#fff" stroke="#c4b5fd"/><text x="700" y="454" text-anchor="middle" class="label">共享物理块池</text><text x="700" y="478" text-anchor="middle" class="small">空闲块按需分配；已释放块重新进入可用集合</text>
<path d="M700 365V425" class="pool"/><polygon points="700,431 694,419 706,419" fill="#7c3aed"/>
<polygon points="1176,290 1164,284 1164,296" class="arrow"/><polygon points="700,431 694,419 706,419" fill="#7c3aed"/>
</svg>
