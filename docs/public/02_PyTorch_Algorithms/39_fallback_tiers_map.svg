<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#94a3b8" flood-opacity=".22"/>
    </filter>
  </defs>
  <rect width="1200" height="620" rx="28" fill="#f8fafc"/>
  <text x="60" y="62" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="700" fill="#0f172a">请求分层如何进入回退决策</text>
  <text x="60" y="96" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="16" fill="#64748b">从可观测请求特征出发，选择保护目标，再检查服务指标</text>

  <rect x="70" y="210" width="250" height="150" rx="18" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)"/>
  <text x="195" y="255" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#075985">请求特征</text>
  <text x="195" y="292" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" fill="#0c4a6e">输入长度 · 生成长度</text>
  <text x="195" y="323" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" fill="#0c4a6e">显存压力 · 排队等待</text>

  <path d="M320 285 H390" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="355" y="267" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" fill="#475569">分层</text>

  <rect x="400" y="170" width="270" height="230" rx="18" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow)"/>
  <text x="535" y="215" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#5b21b6">流量层次</text>
  <rect x="435" y="240" width="200" height="38" rx="10" fill="#ffffff"/>
  <text x="535" y="266" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" fill="#4c1d95">prompt_heavy</text>
  <rect x="435" y="290" width="200" height="38" rx="10" fill="#ffffff"/>
  <text x="535" y="316" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" fill="#4c1d95">decode_heavy</text>
  <rect x="435" y="340" width="200" height="38" rx="10" fill="#ffffff"/>
  <text x="535" y="366" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" fill="#4c1d95">balanced</text>

  <path d="M670 285 H735" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="703" y="267" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" fill="#475569">触发</text>

  <rect x="745" y="120" width="365" height="350" rx="18" fill="#fff7ed" stroke="#fb923c" stroke-width="2" filter="url(#shadow)"/>
  <text x="927" y="166" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#9a3412">回退动作与服务结果</text>
  <path d="M927 185 V220" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="785" y="252" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#c2410c">显存压力高</text>
  <text x="785" y="280" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="16" fill="#7c2d12">关闭可选缓存</text>
  <text x="785" y="306" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" fill="#7c2d12">保护可运行性与 KV 驻留</text>
  <line x1="775" y1="325" x2="1080" y2="325" stroke="#fed7aa" stroke-width="2"/>
  <text x="785" y="360" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#c2410c">排队延迟高</text>
  <text x="785" y="388" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="16" fill="#7c2d12">降低 batch size</text>
  <text x="785" y="414" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" fill="#7c2d12">保护 TTFT 与队列等待</text>
  <line x1="775" y1="433" x2="1080" y2="433" stroke="#fed7aa" stroke-width="2"/>
  <text x="785" y="458" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="16" fill="#7c2d12">指标复核：显存 · TTFT · TPOT · 吞吐</text>
