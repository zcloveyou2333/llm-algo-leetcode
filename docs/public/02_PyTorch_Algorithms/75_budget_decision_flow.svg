<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">显存预算决策的输入与输出</title>
  <desc id="desc">显存预算决策从实测证据和预算约束出发，经过指标比较，形成可行方案和项目决策。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1L11 6L1 11Z" fill="#475569"/>
    </marker>
    <style>
      text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#1f2937}
      .title{font-size:26px;font-weight:700}.subtitle{font-size:15px;font-weight:500;fill:#475569}
      .group{font-size:17px;font-weight:700}.label{font-size:16px;font-weight:700}.small{font-size:13px;fill:#334155}
      .panel{stroke-width:2;rx:18}.node{stroke-width:2;rx:12}.flow{fill:none;stroke:#475569;stroke-width:2.5;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1000" height="560" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="500" y="42" text-anchor="middle" class="title">显存预算决策：从输入到输出</text>
  <text x="500" y="70" text-anchor="middle" class="subtitle">先准备可比较的证据，再用预算条件筛选值得继续验证的方案</text>

  <rect x="350" y="95" width="300" height="62" class="node" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="500" y="122" text-anchor="middle" class="label">显存预算决策</text>
  <text x="500" y="144" text-anchor="middle" class="small">证据、约束、指标共同决定方案</text>

  <rect x="25" y="205" width="225" height="275" class="panel" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="137" y="238" text-anchor="middle" class="group">输入证据</text>
  <rect x="45" y="270" width="185" height="66" class="node" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="137" y="298" text-anchor="middle" class="label">GPU 实测报告</text>
  <text x="137" y="320" text-anchor="middle" class="small">模型、硬件、workload</text>
  <rect x="45" y="365" width="185" height="66" class="node" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="137" y="393" text-anchor="middle" class="label">历史记录</text>
  <text x="137" y="415" text-anchor="middle" class="small">已有结果与复测记录</text>

  <rect x="265" y="205" width="225" height="275" class="panel" fill="#fefce8" stroke="#fde68a"/>
  <text x="377" y="238" text-anchor="middle" class="group">预算约束</text>
  <rect x="285" y="270" width="185" height="66" class="node" fill="#fef3c7" stroke="#d97706"/>
  <text x="377" y="298" text-anchor="middle" class="label">显存上限</text>
  <text x="377" y="320" text-anchor="middle" class="small">可用容量与安全余量</text>
  <rect x="285" y="365" width="185" height="66" class="node" fill="#fef9c3" stroke="#ca8a04"/>
  <text x="377" y="393" text-anchor="middle" class="label">吞吐与质量门槛</text>
  <text x="377" y="415" text-anchor="middle" class="small">最低收益与质量底线</text>

  <rect x="510" y="205" width="225" height="275" class="panel" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="622" y="238" text-anchor="middle" class="group">比较指标</text>
  <rect x="530" y="270" width="185" height="66" class="node" fill="#dcfce7" stroke="#16a34a"/>
  <text x="622" y="298" text-anchor="middle" class="label">峰值显存</text>
  <text x="622" y="320" text-anchor="middle" class="small">allocated / reserved</text>
  <rect x="530" y="365" width="185" height="66" class="node" fill="#ecfccb" stroke="#65a30d"/>
  <text x="622" y="393" text-anchor="middle" class="label">时间、吞吐与质量</text>
  <text x="622" y="415" text-anchor="middle" class="small">速度代价与结果约束</text>

  <rect x="755" y="205" width="220" height="275" class="panel" fill="#faf5ff" stroke="#e9d5ff"/>
  <text x="865" y="238" text-anchor="middle" class="group">决策输出</text>
  <rect x="775" y="270" width="180" height="66" class="node" fill="#f3e8ff" stroke="#9333ea"/>
  <text x="865" y="298" text-anchor="middle" class="label">可行方案</text>
  <text x="865" y="320" text-anchor="middle" class="small">满足约束的候选集合</text>
  <rect x="775" y="365" width="180" height="66" class="node" fill="#fae8ff" stroke="#c026d3"/>
  <text x="865" y="393" text-anchor="middle" class="label">项目决策</text>
  <text x="865" y="415" text-anchor="middle" class="small">accept / tune / reject</text>

  <path d="M500 157 V180 H137 V205" class="flow"/>
  <path d="M500 157 V180 H377 V205" class="flow"/>
  <path d="M500 157 V180 H622 V205" class="flow"/>
  <path d="M500 157 V180 H865 V205" class="flow"/>
</svg>
