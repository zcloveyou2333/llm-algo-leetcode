<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#486581"/></marker><style>.t{font:700 27px sans-serif;fill:#17324d}.s{font:15px sans-serif;fill:#486581}.h{font:700 18px sans-serif;fill:#17324d}.x{font:15px sans-serif;fill:#334e68}.b{stroke:#829ab1;stroke-width:2;rx:14}.l{stroke:#486581;stroke-width:3;fill:none;marker-end:url(#a)}.d{stroke:#829ab1;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1100" height="430" fill="#f7fafc"/><text x="550" y="40" text-anchor="middle" class="t">Kernel 执行路径：dtype、并行层次与异步搬运</text><text x="550" y="68" text-anchor="middle" class="s">候选路径必须同时满足数据类型、shape 对齐、资源和同步条件</text>
  <rect x="45" y="140" width="190" height="150" fill="#e6f6f5" class="b"/><text x="140" y="180" text-anchor="middle" class="h">输入路径</text><text x="140" y="220" text-anchor="middle" class="x">dtype / shape</text><text x="140" y="250" text-anchor="middle" class="x">layout / stride</text>
  <path d="M235 215H280" class="l"/><rect x="280" y="140" width="190" height="150" fill="#fff4e6" class="b"/><text x="375" y="180" text-anchor="middle" class="h">Warp / Block</text><text x="375" y="220" text-anchor="middle" class="x">线程组织</text><text x="375" y="250" text-anchor="middle" class="x">同步与 mask</text>
  <path d="M470 215H515" class="l"/><rect x="515" y="140" width="190" height="150" fill="#eef2ff" class="b"/><text x="610" y="180" text-anchor="middle" class="h">指令路径</text><text x="610" y="220" text-anchor="middle" class="x">Tensor Core</text><text x="610" y="250" text-anchor="middle" class="x">累加 dtype</text>
  <path d="M705 215H750" class="l"/><rect x="750" y="140" width="190" height="150" fill="#eef2ff" class="b"/><text x="845" y="180" text-anchor="middle" class="h">Stream / Event</text><text x="845" y="220" text-anchor="middle" class="x">copy / compute</text><text x="845" y="250" text-anchor="middle" class="x">依赖与重叠</text>
  <path d="M940 215H985" class="l"/><rect x="985" y="140" width="80" height="150" fill="#f0f4f8" class="b"/><text x="1025" y="180" text-anchor="middle" class="h">证据</text><text x="1025" y="220" text-anchor="middle" class="x">time</text><text x="1025" y="250" text-anchor="middle" class="x">trace</text>
  <path d="M610 310V350H845V290" class="d"/><text x="720" y="385" text-anchor="middle" class="s">局部指令收益还要经过同步和搬运，才能影响端到端时间</text>
