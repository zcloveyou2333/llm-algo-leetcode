<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#486581"/></marker><style>.t{font:700 27px sans-serif;fill:#17324d}.s{font:15px sans-serif;fill:#486581}.h{font:700 18px sans-serif;fill:#17324d}.x{font:15px sans-serif;fill:#334e68}.b{stroke:#829ab1;stroke-width:2;rx:14}.l{stroke:#486581;stroke-width:3;fill:none;marker-end:url(#a)}.d{stroke:#829ab1;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1100" height="430" fill="#f7fafc"/><text x="550" y="40" text-anchor="middle" class="t">Autotune 与 Profiling：从候选配置到条件化结论</text><text x="550" y="68" text-anchor="middle" class="s">多 Shape 下分别测量，区分编译成本、Kernel 成本和系统收益</text>
  <rect x="50" y="140" width="180" height="150" fill="#e6f6f5" class="b"/><text x="140" y="180" text-anchor="middle" class="h">Workload 集</text><text x="140" y="220" text-anchor="middle" class="x">shape / dtype</text><text x="140" y="250" text-anchor="middle" class="x">batch / 长度</text>
  <path d="M230 215H275" class="l"/><rect x="275" y="140" width="180" height="150" fill="#fff4e6" class="b"/><text x="365" y="180" text-anchor="middle" class="h">候选配置</text><text x="365" y="220" text-anchor="middle" class="x">tile / warps</text><text x="365" y="250" text-anchor="middle" class="x">stages / layout</text>
  <path d="M455 215H500" class="l"/><rect x="500" y="140" width="180" height="150" fill="#eef2ff" class="b"/><text x="590" y="180" text-anchor="middle" class="h">测量</text><text x="590" y="220" text-anchor="middle" class="x">compile / cache</text><text x="590" y="250" text-anchor="middle" class="x">kernel / trace</text>
  <path d="M680 215H725" class="l"/><rect x="725" y="140" width="180" height="150" fill="#eef2ff" class="b"/><text x="815" y="180" text-anchor="middle" class="h">归因</text><text x="815" y="220" text-anchor="middle" class="x">访存 / 计算</text><text x="815" y="250" text-anchor="middle" class="x">同步 / 资源</text>
  <path d="M905 215H950" class="l"/><rect x="950" y="140" width="115" height="150" fill="#f0f4f8" class="b"/><text x="1007" y="180" text-anchor="middle" class="h">决策</text><text x="1007" y="220" text-anchor="middle" class="x">accept</text><text x="1007" y="250" text-anchor="middle" class="x">tune / reject</text>
  <path d="M815 300V350H365V290" class="d"/><text x="590" y="385" text-anchor="middle" class="s">某个 shape 的最优配置不自动推广到其他 shape，配置缓存和适用范围必须一起记录</text>
</svg>
