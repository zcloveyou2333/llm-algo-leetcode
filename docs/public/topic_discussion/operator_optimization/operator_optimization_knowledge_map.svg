<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#486581"/>
    </marker>
    <style>
      .title{font:700 30px sans-serif;fill:#17324d}.subtitle{font:16px sans-serif;fill:#486581}
      .group{font:700 19px sans-serif;fill:#17324d}.node{font:700 18px sans-serif;fill:#17324d}
      .text{font:15px sans-serif;fill:#334e68}.line{stroke:#486581;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#829ab1;stroke-width:2;stroke-dasharray:8 7;fill:none;marker-end:url(#arrow)}
      .box{stroke:#829ab1;stroke-width:2;rx:14}.panel{stroke-width:2;rx:20}
    </style>
  </defs>
  <rect width="1280" height="720" fill="#f7fafc"/>
  <text x="640" y="45" text-anchor="middle" class="title">算子优化知识地图：从语义到执行证据</text>
  <text x="640" y="75" text-anchor="middle" class="subtitle">先定义正确的计算，再解释数据如何移动、硬件如何执行，最后用 workload 验证收益</text>

  <rect x="55" y="120" width="260" height="475" fill="#e6f6f5" class="panel"/>
  <text x="85" y="160" class="group">计算语义</text>
  <rect x="85" y="195" width="200" height="88" fill="#ffffff" class="box"/>
  <text x="185" y="230" text-anchor="middle" class="node">输入与输出契约</text>
  <text x="185" y="258" text-anchor="middle" class="text">shape · dtype · stride</text>
  <rect x="85" y="315" width="200" height="88" fill="#ffffff" class="box"/>
  <text x="185" y="350" text-anchor="middle" class="node">边界与数值</text>
  <text x="185" y="378" text-anchor="middle" class="text">mask · 误差 · 累加</text>
  <rect x="85" y="435" width="200" height="88" fill="#ffffff" class="box"/>
  <text x="185" y="470" text-anchor="middle" class="node">参考实现</text>
  <text x="185" y="498" text-anchor="middle" class="text">建立可复查基线</text>
  <path d="M185 283 V315" class="line"/>
  <path d="M185 403 V435" class="line"/>

  <rect x="350" y="120" width="260" height="475" fill="#fff4e6" class="panel"/>
  <text x="380" y="160" class="group">数据路径</text>
  <rect x="380" y="195" width="200" height="88" fill="#ffffff" class="box"/>
  <text x="480" y="230" text-anchor="middle" class="node">Tile 与 Layout</text>
  <text x="480" y="258" text-anchor="middle" class="text">线程映射 · 对齐</text>
  <rect x="380" y="315" width="200" height="88" fill="#ffffff" class="box"/>
  <text x="480" y="350" text-anchor="middle" class="node">Load / Compute / Store</text>
  <text x="480" y="378" text-anchor="middle" class="text">全局显存 · 片上复用</text>
  <rect x="380" y="435" width="200" height="88" fill="#ffffff" class="box"/>
  <text x="480" y="470" text-anchor="middle" class="node">中间张量</text>
  <text x="480" y="498" text-anchor="middle" class="text">写回 · 复用 · 融合</text>
  <path d="M480 283 V315" class="line"/>
  <path d="M480 403 V435" class="line"/>

  <rect x="645" y="120" width="260" height="475" fill="#eef2ff" class="panel"/>
  <text x="675" y="160" class="group">硬件执行</text>
  <rect x="675" y="195" width="200" height="88" fill="#ffffff" class="box"/>
  <text x="775" y="230" text-anchor="middle" class="node">Warp 与 Block</text>
  <text x="775" y="258" text-anchor="middle" class="text">并行度 · mask · 同步</text>
  <rect x="675" y="315" width="200" height="88" fill="#ffffff" class="box"/>
  <text x="775" y="350" text-anchor="middle" class="node">Tensor Core 与 dtype</text>
  <text x="775" y="378" text-anchor="middle" class="text">shape 对齐 · 累加路径</text>
  <rect x="675" y="435" width="200" height="88" fill="#ffffff" class="box"/>
  <text x="775" y="470" text-anchor="middle" class="node">Stream 与资源</text>
  <text x="775" y="498" text-anchor="middle" class="text">occupancy · overlap</text>
  <path d="M775 283 V315" class="line"/>
  <path d="M775 403 V435" class="line"/>

  <rect x="940" y="120" width="285" height="475" fill="#f0f4f8" class="panel"/>
  <text x="970" y="160" class="group">验证证据</text>
  <rect x="970" y="195" width="225" height="72" fill="#ffffff" class="box"/>
  <text x="1082" y="224" text-anchor="middle" class="node">数值对齐</text>
  <text x="1082" y="248" text-anchor="middle" class="text">CPU / 参考实现</text>
  <rect x="970" y="295" width="225" height="72" fill="#ffffff" class="box"/>
  <text x="1082" y="324" text-anchor="middle" class="node">Kernel 对照</text>
  <text x="1082" y="348" text-anchor="middle" class="text">时间 · 显存 · trace</text>
  <rect x="970" y="395" width="225" height="72" fill="#ffffff" class="box"/>
  <text x="1082" y="424" text-anchor="middle" class="node">Workload 验证</text>
  <text x="1082" y="448" text-anchor="middle" class="text">Block · 模型 · 服务</text>
  <rect x="970" y="495" width="225" height="72" fill="#ffffff" class="box"/>
  <text x="1082" y="524" text-anchor="middle" class="node">条件化结论</text>
  <text x="1082" y="548" text-anchor="middle" class="text">accept · tune · reject</text>
  <path d="M1082 267 V295" class="line"/>
  <path d="M1082 367 V395" class="line"/>
  <path d="M1082 467 V495" class="line"/>

  <path d="M315 225 H350" class="dash"/>
  <path d="M610 225 H645" class="dash"/>
  <path d="M905 225 H940" class="dash"/>
  <text x="332" y="210" text-anchor="middle" class="text">映射</text>
  <text x="627" y="210" text-anchor="middle" class="text">执行</text>
  <text x="922" y="210" text-anchor="middle" class="text">测量</text>
</svg>
