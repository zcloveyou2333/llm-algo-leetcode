<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
<defs>
  <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 L11 5.5 L0 11 Z" fill="#486581"/></marker>
</defs>
<style>
  .title{font:700 30px sans-serif;fill:#17324d}.sub{font:16px sans-serif;fill:#526581}
  .head{font:700 19px sans-serif;fill:#17324d}.body{font:15px sans-serif;fill:#334e68}.small{font:14px sans-serif;fill:#486581}
  .card{stroke-width:2;rx:18}.flow{stroke:#486581;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
  .branch{stroke:#9b6b16;stroke-width:2.5;fill:none;stroke-dasharray:8 6;marker-end:url(#arrow)}
</style>
<rect width="1400" height="820" fill="#fbfcfe"/>
<text x="700" y="48" text-anchor="middle" class="title">量化部署路线：从约束到有条件的决策</text>
<text x="700" y="78" text-anchor="middle" class="sub">先确定压缩对象和处理时机，再选择训练适配或部署路径，最后用同一 workload 验证。</text>

<rect x="480" y="112" width="440" height="100" class="card" fill="#e6f0ff" stroke="#8fb3d8"/>
<text x="700" y="150" text-anchor="middle" class="head">量化问题定义</text>
<text x="700" y="178" text-anchor="middle" class="body">质量下限 · 显存预算 · 延迟 / 吞吐目标</text>

<rect x="70" y="292" width="350" height="160" class="card" fill="#fff4d6" stroke="#e0b34f"/>
<text x="245" y="330" text-anchor="middle" class="head">训练适配分支</text>
<text x="245" y="360" text-anchor="middle" class="body">PTQ 质量不足</text>
<text x="245" y="388" text-anchor="middle" class="body">QAT / QLoRA</text>
<text x="245" y="420" text-anchor="middle" class="small">训练成本换取质量恢复</text>

<rect x="525" y="292" width="350" height="160" class="card" fill="#e8f5ee" stroke="#76b893"/>
<text x="700" y="330" text-anchor="middle" class="head">权重量化主线</text>
<text x="700" y="360" text-anchor="middle" class="body">W8A16 · GPTQ · AWQ</text>
<text x="700" y="388" text-anchor="middle" class="body">部署前生成量化权重</text>
<text x="700" y="420" text-anchor="middle" class="small">主要改善装载容量与权重带宽</text>

<rect x="980" y="292" width="350" height="160" class="card" fill="#fce8e6" stroke="#d98b87"/>
<text x="1155" y="330" text-anchor="middle" class="head">运行时与 Cache 路径</text>
<text x="1155" y="360" text-anchor="middle" class="body">FP8 · 激活低精度</text>
<text x="1155" y="388" text-anchor="middle" class="body">KV Cache 量化</text>
<text x="1155" y="420" text-anchor="middle" class="small">改变执行路径或请求期容量</text>

<path d="M700 212 V250 H245 V292" class="branch"/>
<path d="M700 212 V292" class="flow"/>
<path d="M700 250 H1155 V292" class="flow"/>

<rect x="70" y="532" width="350" height="112" class="card" fill="#fffaf0" stroke="#c49a3a"/>
<text x="245" y="570" text-anchor="middle" class="head">训练产物</text>
<text x="245" y="600" text-anchor="middle" class="body">adapter / merged model</text>
<text x="245" y="625" text-anchor="middle" class="small">重新生成可部署 artifact</text>

<rect x="525" y="532" width="350" height="112" class="card" fill="#f2fbf5" stroke="#76b893"/>
<text x="700" y="570" text-anchor="middle" class="head">量化 artifact</text>
<text x="700" y="600" text-anchor="middle" class="body">权重格式 · scale · loader 配置</text>
<text x="700" y="625" text-anchor="middle" class="small">GPTQ / AWQ / GGUF 分开验证</text>

<rect x="980" y="532" width="350" height="112" class="card" fill="#fff5f4" stroke="#d98b87"/>
<text x="1155" y="570" text-anchor="middle" class="head">运行时配置</text>
<text x="1155" y="600" text-anchor="middle" class="body">dtype · kernel · Cache policy</text>
<text x="1155" y="625" text-anchor="middle" class="small">确认硬件和 backend 真正支持</text>

<path d="M245 452 V532" class="branch"/>
<path d="M700 452 V532" class="flow"/>
<path d="M1155 452 V532" class="flow"/>
<path d="M245 644 V690 H700 V720" class="branch"/>
<path d="M700 644 V720" class="flow"/>
<path d="M1155 644 V690 H700 V720" class="flow"/>

<rect x="430" y="720" width="540" height="66" class="card" fill="#e9f2f9" stroke="#829ab1"/>
<text x="700" y="748" text-anchor="middle" class="head">统一 workload 验证</text>
<text x="700" y="772" text-anchor="middle" class="small">质量 · 显存 · TTFT / TPOT · 吞吐 · P99 · 证据等级</text>
</svg>
