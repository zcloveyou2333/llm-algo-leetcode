<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#486581"/>
    </marker>
    <style>
      .title{font:700 28px sans-serif;fill:#17324d}
      .group{font:700 16px sans-serif;fill:#486581}
      .node{font:700 19px sans-serif;fill:#17324d}
      .body{font:16px sans-serif;fill:#334e68}
      .small{font:14px sans-serif;fill:#486581}
      .box{stroke:#829ab1;stroke-width:2;rx:14}
      .line{stroke:#486581;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1400" height="760" fill="#f7fafc"/>
  <text x="700" y="46" text-anchor="middle" class="title">分布式显存：从容量缺口到多卡证据</text>

  <rect x="500" y="76" width="400" height="112" fill="#e6f6f5" class="box"/>
  <text x="700" y="116" text-anchor="middle" class="node">单卡容量缺口</text>
  <text x="700" y="150" text-anchor="middle" class="body">模型状态或运行时对象无法在当前预算容纳</text>

  <rect x="40" y="220" width="1320" height="310" fill="#fff8eb" stroke="#e0a23b" class="box"/>
  <text x="70" y="252" class="group">先确定可以切分的对象</text>

  <rect x="75" y="285" width="275" height="180" fill="#ffffff" class="box"/>
  <text x="212" y="327" text-anchor="middle" class="node">ZeRO / 状态分片</text>
  <text x="212" y="365" text-anchor="middle" class="body">参数、梯度、</text>
  <text x="212" y="391" text-anchor="middle" class="body">optimizer state</text>
  <text x="212" y="433" text-anchor="middle" class="small">同步与状态聚合</text>

  <rect x="385" y="285" width="275" height="180" fill="#ffffff" class="box"/>
  <text x="522" y="327" text-anchor="middle" class="node">Tensor Parallel</text>
  <text x="522" y="365" text-anchor="middle" class="body">层内权重或</text>
  <text x="522" y="391" text-anchor="middle" class="body">中间激活</text>
  <text x="522" y="433" text-anchor="middle" class="small">高频 collective</text>

  <rect x="695" y="285" width="275" height="180" fill="#ffffff" class="box"/>
  <text x="832" y="327" text-anchor="middle" class="node">Pipeline Parallel</text>
  <text x="832" y="365" text-anchor="middle" class="body">层与 activation</text>
  <text x="832" y="403" text-anchor="middle" class="body">分到不同 stage</text>
  <text x="832" y="433" text-anchor="middle" class="small">bubble 与负载平衡</text>

  <rect x="1005" y="285" width="275" height="180" fill="#ffffff" class="box"/>
  <text x="1142" y="327" text-anchor="middle" class="node">Expert Parallel</text>
  <text x="1142" y="365" text-anchor="middle" class="body">expert 权重与 token</text>
  <text x="1142" y="403" text-anchor="middle" class="body">按路由分摊</text>
  <text x="1142" y="433" text-anchor="middle" class="small">all-to-all 与负载均衡</text>

  <path d="M700 188 V215 H212 V285" class="line"/>
  <path d="M700 188 V215 H522 V285" class="line"/>
  <path d="M700 188 V215 H832 V285" class="line"/>
  <path d="M700 188 V215 H1142 V285" class="line"/>

  <rect x="40" y="575" width="1320" height="115" fill="#eef2ff" stroke="#829ab1" class="box"/>
  <text x="70" y="607" class="group">再用同一 workload 验证显存收益是否值得系统代价</text>
  <rect x="75" y="625" width="275" height="48" fill="#ffffff" class="box"/>
  <text x="212" y="656" text-anchor="middle" class="body">单卡 / 多卡显存</text>
  <rect x="385" y="625" width="275" height="48" fill="#ffffff" class="box"/>
  <text x="522" y="656" text-anchor="middle" class="body">通信时间与等待</text>
  <rect x="695" y="625" width="275" height="48" fill="#ffffff" class="box"/>
  <text x="832" y="656" text-anchor="middle" class="body">吞吐、延迟与稳定性</text>
  <rect x="1005" y="625" width="275" height="48" fill="#ffffff" class="box"/>
  <text x="1142" y="656" text-anchor="middle" class="body">accept / tune / reject</text>

  <path d="M212 465 V535 H212 V625" class="line"/>
  <path d="M522 465 V535 H522 V625" class="line"/>
  <path d="M832 465 V535 H832 V625" class="line"/>
  <path d="M1142 465 V535 H1142 V625" class="line"/>
</svg>
